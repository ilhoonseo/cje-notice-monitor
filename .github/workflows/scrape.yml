name: Cheongju National University Notices Scraper (Manual Only)

on:
  workflow_dispatch: # Scheduled monitoring moved to Codex Scheduled Tasks

permissions:
  contents: write # Required to allow committing and pushing changes back to the repository

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can push back cleanly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to notices.json or status.json
          git add data/notices.json data/status.json
          
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update notice board data [skip ci]"
            git push
            echo "Changes pushed to repository."
          else
            echo "No changes in notice board data. Skipping commit."
          fi
